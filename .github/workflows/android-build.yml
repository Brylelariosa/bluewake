
name: BlueWake Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout BlueWake
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ninja-build \
            git \
            build-essential \
            pkg-config \
            libvulkan-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libxss-dev \
            libxtst-dev \
            zlib1g-dev \
            libpng-dev \
            libfreetype6-dev \
            libsqlite3-dev \
            libzstd-dev \
            libfmt-dev \
            libbz2-dev \
            libbrotli-dev \
            libicu-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/wwhd/requirements.txt
          python -m pip install ninja cmake

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      - name: Download private game ISO
        env:
          GH_TOKEN: ${{ secrets.GAMEFILES_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/bluewake-disc"

          gh release download iso-v1 \
            --repo Brylelariosa/BlueWake-GameFiles \
            --pattern "*.iso" \
            --dir "$RUNNER_TEMP/bluewake-disc"

          ISO=$(find "$RUNNER_TEMP/bluewake-disc" \
            -maxdepth 1 -name "*.iso" -print -quit)

          test -n "$ISO"
          echo "BLUEWAKE_ISO=$ISO" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: |
          python scripts/android/build.py \
            "$BLUEWAKE_ISO" \
            --sdk "$ANDROID_HOME" \
            --jdk "$JAVA_HOME" \
            --jobs 2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueWake-Android-APK
          path: build/android/WindWakerRecomp.apk
          if-no-files-found: error
          retention-days: 7
