
name: BlueWake Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout BlueWake
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          sdkmanager --install `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;35.0.0" `
            "ndk;29.0.14206865"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK installation failed"
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r scripts/wwhd/requirements.txt
          python -m pip install ninja

      - name: Download private ISO
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GAMEFILES_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $disc = "$env:RUNNER_TEMP\bluewake-disc"
          New-Item -ItemType Directory -Force -Path $disc | Out-Null

          gh release download iso-v1 `
            --repo Brylelariosa/BlueWake-GameFiles `
            --pattern "*.iso" `
            --dir $disc

          if ($LASTEXITCODE -ne 0) {
            throw "ISO download failed"
          }

          $iso = Get-ChildItem $disc -Filter "*.iso" |
            Select-Object -First 1

          if (-not $iso) {
            throw "ISO file not found"
          }

          "BLUEWAKE_ISO=$($iso.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Android APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vs) {
            throw "Visual Studio C++ tools not found"
          }

          $llvm = Join-Path $vs 'VC\Tools\Llvm\x64'

          if (-not (Test-Path "$llvm\bin\clang-cl.exe")) {
            throw "Visual Studio LLVM clang-cl not found"
          }

          python scripts/android/build.py "$env:BLUEWAKE_ISO" `
            --llvm "$llvm" `
            --sdk "$env:ANDROID_HOME" `
            --jdk "$env:JAVA_HOME" `
            --jobs 2

          if ($LASTEXITCODE -ne 0) {
            throw "BlueWake Android build failed"
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueWake-Android-APK
          path: build/android/WindWakerRecomp.apk
          if-no-files-found: error
          retention-days: 3
